<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>tilemap_editor</title>
  </head>
  <body>
    <div class="app">
      <div class="modebar">
        <div id="pick-mode-btn" class="button">Pick</div>
        <div id="draw-mode-btn" class="button">Draw</div>
      </div>
      <div class="toolbar">
        <div class="button">Start ~ TileMap</div>
        <div class="button">Import ~ TileMap</div>
        <div class="button">Export ~ TileMap</div>
        <div class="button">TileMap ~ Finish</div>
      </div>
      <canvas id="draw_canvas"></canvas>
      <div class="picker-row">
        <canvas id="picker_canvas"></canvas>
        <div class="tile-dictionary">
          <div class="tile-dictionary-title">Tile Dictionary</div>
          <div id="tile-dictionary-list" class="tile-dictionary-list"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
